syntax = "proto3";

option java_multiple_files = true;
option java_package = "generated";

service ItemListingService {
  rpc AddItemListing(AddItemListingRequest) returns (ItemListingResponse);
  rpc GetItemListing(GetItemListingRequest) returns (ItemListingResponse);
  rpc ListItemListings (ListItemListingsRequest) returns (ListItemListingsResponse);
}
enum ImageFileType{
  PNG = 0;
  JPG = 1;
  JPEG = 2;
}
enum Category {
  CLOTHING = 0;
  ACCESSORIES = 1;
  CURIOS = 2;
}
// Represents a ItemListing entity in the system.
message ItemListing {
  int32 id = 1;
  string itemName = 2;
  string memberName = 3;
  string description = 4;
  int32 price = 5;
  Album album = 6;
  repeated Category categories = 7;
}
message UploadImageRequest{
 Image image = 1;
}
//Will only be used to verify the upload
message UploadSummary {
  uint32 received_count = 1;
  uint64 total_bytes = 2;
}

message Album {
  string title = 1;
  repeated Image images = 2;
}
message Image {
  string name = 1;
  ImageFileType filetype = 2;
  uint32 width = 3;
  uint32 height = 4;
  bytes data = 5;
  }
  message Date {
  int32 year = 1;
  int32 month = 2;
  int32 day = 3;
  }
message ImageList {
  repeated Image images = 1;
}
// Request message for creating a new item listing.
message AddItemListingRequest {
  string itemName = 1;
  string memberName = 2;
  string description = 3;
  int32 price = 4;
  Album album = 5;
  repeated Category categories = 6;
}

message ListItemListingsRequest  {
  int32 page_size = 1;
  string page_token = 2;
}

message ListItemListingsResponse {
  repeated ItemListing items = 1;
  string next_page_token = 2;
}
// Request message for retrieving an item listing
message GetItemListingRequest {
  int32 id = 1;
}

message ItemListingResponse {
  // The item listing entity (created or retrieved).
  ItemListing itemlisting = 1;
}