syntax = "proto3";
import "google/protobuf/timestamp.proto";
option java_multiple_files = true;
option java_package = "generated";

service ItemListingService {
  rpc AddItemListing (AddItemListingRequest) returns (StatusResponse);
  rpc GetItemListing (GetItemListingRequest) returns (ItemListingResponse);
  rpc ListItemListings (GetItemListingListRequest) returns (ListItemListingsResponse);
}

//------Section global variables-------
enum ImageFileType{
  //UNSPECIFIED = -1;
  PNG = 0;
  JPG = 1;
  JPEG = 2; //JPEG and JPG are interchangable filetypes, if preferable collapse into a single type, if not then store both
}
enum Category {
  //UNSPECIFIED = -1;
  CLOTHING = 0;
  ACCESSORIES = 1;
  CURIOS = 2;
}

message Date {
  int32 year = 1;
  int32 month = 2;
  int32 day = 3;
}

message Thumbnail{
  ImageFileType filetype = 1;
  bytes data = 2;      //200x200 max
}

message ItemListingSummary{
  int32 id = 1;
  string itemName = 2;
  int32 price = 3;
  Thumbnail thumbnail = 4;
}

//-----------Section entities-----------
message Image {
  string name = 1;
  ImageFileType filetype = 2;
  uint32 width = 3;
  uint32 height = 4;
  bytes data = 5;
}
message ItemListing {
  int32 id = 1;
  string itemName = 2;
  string memberName = 3;
  string description = 4;
  int32 price = 5;
  repeated Image images = 6;
  repeated Category categories = 7;
  Date created_at = 8;
}
message Member {
  string memberName = 1;
  string memberEmail = 2;
}
message Message {
  int32 id = 1;
  int32 conversation_id = 2;
  int32 sender_id = 3;
  string content = 4;
  //https://www.baeldung.com/java-convert-google-protocol-buffer-timestamp-localdate
  google.protobuf.Timestamp created_at = 5;
}
message Conversation {
  int32 id = 1;
  repeated string participant_ids = 2;
  int32  item_listing_id = 3;
}
//---------Rpc Requests and Responses--------

message AddItemListingRequest {
  string itemName = 1;
  string memberName = 2;
  string description = 3;
  int32 price = 4;
  repeated Category categories = 6;
  repeated Image images = 7;
}

message AddImageRequest{
  int32 item_id= 1;
  Image image = 2;
}
message RegistrationRequest{

}
message UpdateItemListingRequest{
  string itemName = 1;
  string memberName = 2;
  string description = 3;
  int32 price = 4;
  repeated Category categories = 6;
  repeated Image images = 7;
}

message GetItemListingListRequest  {
  int32 page_size = 1;
  string page_token = 2;
}

message ListItemListingsResponse {
  repeated ItemListingSummary items = 1;
  string next_page_token = 2;
}

message GetItemListingRequest {
  int32 id = 1;
}

message ItemListingResponse {
  ItemListing itemlisting = 1;
}
//Only used when verifying any upload or registration or creation
message StatusResponse {
  string response = 1;
}