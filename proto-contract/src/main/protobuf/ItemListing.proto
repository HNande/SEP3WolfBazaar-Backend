syntax = "proto3";

option java_multiple_files = true;
option java_package = "generated";

service ItemListingService {
  rpc AddItemListing(AddItemListingRequest) returns ( ItemListingResponse);
  rpc GetItemListing(GetItemListingRequest) returns (ItemListingResponse);
  rpc ListItemListings (ListItemListingsRequest) returns (ListItemListingsResponse);
  rpc ListItemSummaries(ListItemListingsRequest) returns (ListItemSummariesResponse);
  rpc GetItemThumbnails(GetItemThumbnailsRequest) returns (GetItemThumbnailsResponse);
}

message ItemSummary {
  int32 id = 1;  string itemName = 2;
  string description = 3;  int32 price = 4;
  Date date = 5;
}
message ListItemSummariesResponse { repeated ItemSummary items = 1; string next_page_token = 2; }
message GetItemThumbnailsRequest { repeated int32 item_ids = 1; }
message ItemThumbnail { int32 item_id = 1; ImageFileType filetype = 2;
  uint32 width = 3; uint32 height = 4; bytes data = 5; }
message GetItemThumbnailsResponse { repeated ItemThumbnail thumbnails = 1; }

enum ImageFileType{
  PNG = 0;
  JPG = 1;
  JPEG = 2;
}
// Represents a ItemListing entity in the system.
message ItemListing {
  int32 id = 1;
  string itemName = 2;
  string description = 3;
  int32 price = 4;
  Album album = 5;
  Date date = 6;
}
message UploadImageRequest{
 Image image = 1;
}
//Will only be used to verify Image upload
message UploadSummary {
  uint32 received_count = 1;
  uint64 total_bytes = 2;
}

message Album {
  string title = 1;
  repeated Image images = 2;
}
message Image {
  string name = 1;
  ImageFileType filetype = 2;
  uint32 width = 3;
  uint32 height = 4;
  bytes data = 5;
  }
  message Date {
  int32 year = 1;
  int32 month = 2;
  int32 day = 3;
  }
message ImageList {
  repeated Image images = 1;
}
// Request message for creating a new item listing.
message AddItemListingRequest {
  string itemName = 1;
  string description = 2;
  int32 price = 3;
  Album album = 4;
}

message ListItemListingsRequest  {
  int32 page_size = 1;
  string page_token = 2;
}

message ListItemListingsResponse {
  repeated ItemListing items = 1;
  string next_page_token = 2;
}
// Request message for retrieving an item listing
message GetItemListingRequest {
  // ID of the item listing to retrieve.
  int32 id = 1;
}

message ItemListingResponse {
  // The item listing entity (created or retrieved).
  ItemListing itemlisting = 1;
}